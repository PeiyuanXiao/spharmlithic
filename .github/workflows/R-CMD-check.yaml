name: R-CMD-check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck

      # ── Python / conda setup ──────────────────────────────
      - name: Install Miniconda via reticulate
        shell: Rscript {0}
        run: |
          reticulate::install_miniconda()

      - name: Create spharmlithic Python environment
        shell: Rscript {0}
        run: |
          install.packages(".", repos = NULL, type = "source")
          library(spharmlithic)
          install_spharmlithic_python(mesh = TRUE)
          # Export the env's Python for the later steps: without it,
          # reticulate does not find the env during R CMD check and the
          # Python-backed tests are skipped.
          py <- reticulate::conda_python("r-spharmlithic")
          cat("RETICULATE_PYTHON=", py, "\n", sep = "",
              file = Sys.getenv("GITHUB_ENV"), append = TRUE)

      - name: Check that reticulate finds the Python backend
        shell: Rscript {0}
        run: |
          print(reticulate::py_config())
          stopifnot(reticulate::py_module_available("pyshtools"))

      # macOS: CRAN R ships its own libomp, which data.table (imported via
      # plotly) initialises on load. Show the conda env's BLAS / OpenMP
      # packages, then load data.table and the Python stack in one R process.
      - name: Diagnose OpenMP runtimes (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        shell: bash
        run: |
          echo "--- BLAS / OpenMP packages in the conda env"
          ls "$(dirname "$(dirname "$RETICULATE_PYTHON")")/conda-meta" | grep -i -E 'openblas|openmp|libblas' || true
          echo "--- data.table + Python stack in one R process"
          Rscript -e 'library(data.table); invisible(getDTthreads(verbose = TRUE)); sl <- reticulate::import("scipy.linalg"); invisible(sl$svd(matrix(rnorm(400), 20))); invisible(reticulate::import("pyshtools")); cat("no OpenMP conflict\n")'

      # ── R CMD check ──────────────────────────────────────
      - uses: r-lib/actions/check-r-package@v2
        env:
          RETICULATE_MINICONDA_ENABLED: true